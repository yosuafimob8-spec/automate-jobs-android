services:
  - type: web
    name: karirmate-ai-interview
    runtime: python
    plan: free
    buildCommand: pip install -r backend/ai_interview/requirements.txt
    startCommand: uvicorn backend.ai_interview.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      - key: AUTH_VERIFY_URL
        sync: false
