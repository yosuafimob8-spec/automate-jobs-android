name: KarirMate V74 Tests Only

on:
  push:
    branches:
      - integration/v74-gabungan-test-20261113

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate training assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 scripts/generate_training_videos.py

      - name: Compile and test V74
        run: |
          chmod +x gradlew
          ./gradlew :app:compileTermuxKotlin :app:testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v74-test-reports
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
