name: AI Interview Test APK

on:
  push:
    branches:
      - fix/profile-gate-unknown-status-20261101
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Run unit tests and build installable debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleTermux --stacktrace
      - name: Upload phone test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KarirMate-AI-Interview-Phone-Test
          path: app/build/outputs/apk/termux/*.apk
          if-no-files-found: warn
