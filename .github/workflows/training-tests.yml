name: Training Unit Tests Only
on:
  workflow_dispatch:
  push:
    branches:
      - feature/training-completion-no-apk-20261102
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test certificate registry (Python, no APK)
        run: cd certificate-registry && python3 -m unittest -v test_server.py test_trusted_training.py test_training_api.py
      - name: Validate training content and run unit tests (no APK)
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-unit-test-reports
          path: app/build/reports/tests/
