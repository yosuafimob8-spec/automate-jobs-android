name: Deploy KarirMate Worker V73

on:
  push:
    branches:
      - integration/base41860101825-ui-merge-20261105
    paths:
      - .github/workflows/deploy-worker-v73.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Worker JavaScript
        run: node --check services/cloudflare-worker/src/worker.js

      - name: Verify Cloudflare configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "Missing API token"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing account ID"; exit 1; }

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Validate Cloudflare secret format
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'CHECK'
          import os, re, sys
          token = os.getenv("CF_TOKEN", "")
          account = os.getenv("CF_ACCOUNT", "")
          if not token or any(c.isspace() for c in token):
              sys.exit("FAIL: Format API Token tidak valid")
          if not re.fullmatch(r"[0-9a-fA-F]{32}", account):
              sys.exit("FAIL: Format Account ID tidak valid")
          print("PASS: Format Cloudflare Secrets")
          CHECK

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.161.0"
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/cloudflare-worker
          command: deploy --config wrangler.jsonc
