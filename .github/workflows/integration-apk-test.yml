name: KarirMate Integration APK Test
on:
  workflow_dispatch:
  push:
    branches:
      - integration/latest-base-all-fixes-20261102
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate offline training videos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 scripts/generate_training_videos.py
      - name: Test and build Termux APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleTermux --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KarirMate-Integration-Test-APK
          path: app/build/outputs/apk/termux/*.apk
          if-no-files-found: error
