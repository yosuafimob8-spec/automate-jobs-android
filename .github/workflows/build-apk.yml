name: Build Karir Mate APK - Canonical (Manual Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify main KarirMate package and restored Psikotes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.example.automatesmartbot"' app/build.gradle.kts
          ! grep -Fq 'applicationIdSuffix' app/build.gradle.kts
          grep -Fq 'KM_V74_RESTORE_RULES_20261114' app/src/main/java/com/example/automatesmartbot/ui/screens/LatihanPsikotesScreen.kt
          grep -Fq 'val displayedCount = mode.n("question_count").coerceIn(1, 110)' app/src/main/java/com/example/automatesmartbot/ui/screens/LatihanPsikotesScreen.kt
          grep -Fq 'val displayedSeconds = mode.n("duration_seconds")' app/src/main/java/com/example/automatesmartbot/ui/screens/LatihanPsikotesScreen.kt

      - name: Restore pinned signing key D2 (no generated keys)
        shell: bash
        env:
          KARIRMATE_DEBUG_KEYSTORE_B64: ${{ secrets.KARIRMATE_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${KARIRMATE_DEBUG_KEYSTORE_B64:-}" || { echo '::error::Pinned keystore secret unavailable'; exit 1; }
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$KARIRMATE_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          unset KARIRMATE_DEBUG_KEYSTORE_B64
          sha1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ "$sha1" != 'D263B4E01CB34E203F3B2EA1779D033720A33F2A' ]]; then
            echo '::error::Wrong signing key; build refused'; exit 1
          fi
          echo 'PASS: D2 signing verified'

      - name: Generate offline training videos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 scripts/generate_training_videos.py

      - name: Run Android tests and build main Termux APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleTermux --no-daemon --no-configuration-cache --max-workers=2 --stacktrace

      - name: Verify main package and exact D2 APK signer
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/termux/*.apk)
          (( ${#apks[@]} == 1 )) || { echo '::error::Expected exactly one APK'; exit 1; }
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(find "$sdk/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$sdk/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$aapt" && test -n "$apksigner"
          apk="${apks[0]}"
          "$apksigner" verify "$apk"
          pkg="$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          [[ "$pkg" == 'com.example.automatesmartbot' ]] || { echo "::error::Wrong package $pkg"; exit 1; }
          sha1="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-1 digest: *//p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ "$sha1" == 'D263B4E01CB34E203F3B2EA1779D033720A33F2A' ]] || { echo '::error::Wrong signer'; exit 1; }
          echo "PASS: main package=$pkg signer=$sha1"
          ls -lh "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: KARIRMATE-UTAMA-V74-PSIKOTES-D2
          path: app/build/outputs/apk/termux/*.apk
          if-no-files-found: error
