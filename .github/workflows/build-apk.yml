name: Build Karir Mate APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'fix/karirmate-comprehensive-repair', 'fix/profile-gate-unknown-status-20261101']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate offline training videos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 scripts/generate_training_videos.py
      - name: Run Android unit tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleTermux --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Karir-Mate-debug-APK
          path: app/build/outputs/apk/termux/*.apk
