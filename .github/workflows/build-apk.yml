name: Build Karir Mate APK - Canonical (Manual Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate offline training videos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 scripts/generate_training_videos.py
      - name: Run Android unit tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleTermux --stacktrace
      - name: Verify APK output before upload
        run: |
          ls -lh app/build/outputs/apk/termux/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Karir-Mate-debug-APK
          path: app/build/outputs/apk/termux/*.apk
          if-no-files-found: error
