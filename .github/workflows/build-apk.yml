name: Build Karir Mate APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleTermux --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Karir-Mate-debug-APK
          path: app/build/outputs/apk/termux/*.apk
