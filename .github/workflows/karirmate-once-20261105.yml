name: KarirMate One-Time Build 2026-11-05
on:
  push:
    branches:
      - integration/base41860101825-ui-merge-20261105
    paths:
      - .github/build-request-20261105.txt
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate offline training videos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 scripts/generate_training_videos.py
      # UI test and APK assembly must not compete for CI resources: Robolectric
      # Compose tests reported Espresso AppNotIdleException under simultaneous work.
      - name: Run Android unit tests (isolated)
        id: unit_tests
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-parallel --max-workers=1 --stacktrace
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KarirMate-UI-Tests-Report
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Assemble Android APK (isolated)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleTermux --no-parallel --max-workers=1 --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KarirMate-UI-Updates-1-to-8-APK
          path: app/build/outputs/apk/termux/*.apk
          if-no-files-found: error
      - name: Enforce test gate after APK upload
        if: steps.unit_tests.outcome == 'failure'
        run: |
          echo "::error::Unit tests failed. The APK artifact is available for investigation, but this run is NOT validated."
          exit 1
