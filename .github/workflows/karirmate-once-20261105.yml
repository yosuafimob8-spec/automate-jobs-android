name: KarirMate One-Time Build 2026-11-05
on:
  push:
    branches:
      - integration/base41860101825-ui-merge-20261105
    paths:
      - .github/build-request-20261105.txt
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate offline training videos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 scripts/generate_training_videos.py
      - name: Test and build Android APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleTermux --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KarirMate-Updates-5-to-10-APK
          path: app/build/outputs/apk/termux/*.apk
          if-no-files-found: error
