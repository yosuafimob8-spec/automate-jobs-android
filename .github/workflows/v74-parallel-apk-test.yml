name: KarirMate V74 PARALLEL APK - Safe Test

on:
  push:
    branches:
      - integration/v74-psikotes-parallel-20261114

permissions:
  contents: read

jobs:
  build-parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify separate package and V74 rules
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationIdSuffix = ".v74test"' app/build.gradle.kts
          grep -F 'KM_V74_RESTORE_RULES_20261114' app/src/main/java/com/example/automatesmartbot/ui/screens/LatihanPsikotesScreen.kt
          grep -F 'val displayedCount = mode.n("question_count").coerceIn(1, 110)' app/src/main/java/com/example/automatesmartbot/ui/screens/LatihanPsikotesScreen.kt
          grep -F 'KarirMate V74 TEST' app/src/termux/res/values/strings.xml

      - name: Restore stable test signing key (D2 SHA-1)
        env:
          KARIRMATE_DEBUG_KEYSTORE_B64: ${{ secrets.KARIRMATE_DEBUG_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KARIRMATE_DEBUG_KEYSTORE_B64:-}" ]]; then
            echo '::error::Signing secret unavailable. Refusing random signing.'
            exit 1
          fi
          mkdir -p "$HOME/.android"
          umask 077
          printf '%s' "$KARIRMATE_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          unset KARIRMATE_DEBUG_KEYSTORE_B64
          actual="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected='D263B4E01CB34E203F3B2EA1779D033720A33F2A'
          if [[ "$actual" != "$expected" ]]; then
            echo '::error::Unexpected signing key. Refusing APK build.'
            exit 1
          fi
          echo 'PASS: D2 signing certificate verified'

      - name: Generate offline training assets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 scripts/generate_training_videos.py

      - name: Test and build parallel Termux APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleTermux --no-daemon --no-configuration-cache --max-workers=2 --stacktrace

      - name: Verify parallel package, APK signature and output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/termux/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo '::error::Expected exactly one Termux APK.'
            exit 1
          fi
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(find "$sdk/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$sdk/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$aapt" && test -n "$apksigner"
          apk="${apks[0]}"
          "$apksigner" verify "$apk"
          pkg="$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          if [[ "$pkg" != 'com.example.automatesmartbot.v74test' ]]; then
            echo "::error::Unexpected package $pkg; may overwrite installed V74."
            exit 1
          fi
          sha1="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-1 digest: *//p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ "$sha1" != 'D263B4E01CB34E203F3B2EA1779D033720A33F2A' ]]; then
            echo '::error::APK signature mismatch.'
            exit 1
          fi
          echo "PASS: package=$pkg; signing=$sha1"
          ls -lh "$apk"

      - name: Upload installable V74 parallel test APK
        uses: actions/upload-artifact@v4
        with:
          name: KARIRMATE-V74-PSIKOTES-PARALLEL-TEST
          path: app/build/outputs/apk/termux/*.apk
          if-no-files-found: error
